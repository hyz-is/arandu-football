# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/football"
# This package imports nothing from the framework or from any other module; the
# floor is the first Framework release the Arandu packages of the same
# generation were built against.
framework = ">= 0.71"
profiles = ["conventional", "performance"]

[permissions]
# It asks the API-Football service for leagues, teams and fixtures: GET
# requests to https://v3.football.api-sports.io, or to the BaseURL it is given,
# and nothing else.
network = true
# It reads no file and writes none.
filesystem = false
# It runs no other program.
exec = false
# It owns no table: it keeps the last request allowance in memory, nothing else.
migrations = false
